scenario: scenarios.example_turtlebot3
agent:
  namespaces: ""
  behavior_tree_xml: default_bt.xml
bt_runner:
  bt_tick_rate: 10.0
  bt_visualiser:
    enabled: true
    screen_width: 1000
    screen_height: 700
  profiling_mode: false
turtlebot3:
  use_sim_time: true
  goal_topic: /bt/goal_pose
  global_frame: map
  robot_frame: base_link
  navigation_action: /navigate_to_pose
  capture_service: /bt/capture_image
  setup_timeout: 15.0
  navigation_timeout: 300.0
  capture_timeout: 10.0
